<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#08090c">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2308090c'/%3E%3Crect x='7' y='14' width='18' height='4' rx='2' fill='%23d9ff3c'/%3E%3C/svg%3E">
<title>某某汽车 · 制动踏板极限测试</title>
<style>
  html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#08090c;
            -webkit-tap-highlight-color:transparent}
  #stage{position:fixed;inset:0}
  #unity-canvas{width:100%;height:100%;display:block;outline:none;
                touch-action:none;background:#08090c}
  #load{position:fixed;inset:0;z-index:10;display:flex;flex-direction:column;
        align-items:center;justify-content:center;background:#08090c;color:#e6e8ec;
        font-family:system-ui,-apple-system,'Microsoft YaHei','PingFang SC',sans-serif;
        transition:opacity .35s ease}
  #load.done{opacity:0;pointer-events:none}
  .t1{font-size:17px;font-weight:700;letter-spacing:.06em}
  .t2{margin-top:10px;font-size:12px;color:#6b7079;letter-spacing:.12em}
  #bar{margin-top:22px;width:min(280px,62vw);height:3px;background:#171a20;overflow:hidden}
  #fill{width:0;height:100%;background:#d9ff3c}
  #pct{margin-top:12px;font-size:12px;color:#6b7079;font-variant-numeric:tabular-nums}
  #err{position:fixed;left:0;right:0;bottom:0;z-index:20;display:none;padding:14px;
       background:#2a0b09;color:#ffb4ae;font:12px/1.6 ui-monospace,Consolas,monospace;
       white-space:pre-wrap;max-height:45vh;overflow:auto}
  /* 与「文字版」互相切换的入口。部署在 /unity/ 时 ../ 就是文字版首页 */
  #toText{position:fixed;top:0;right:0;z-index:15;display:flex;align-items:center;
          gap:6px;padding:10px 14px;color:#7a8089;text-decoration:none;
          font:12px/1 system-ui,-apple-system,'Microsoft YaHei','PingFang SC',sans-serif;
          letter-spacing:.08em;transition:color .2s}
  #toText:hover{color:#d9ff3c}
  #toText span{font-size:14px}
</style>
</head>
<body>
<a id="toText" href="../"><span>&#8592;</span>文字版</a>
<div id="stage"><canvas id="unity-canvas" tabindex="-1"></canvas></div>
<div id="load">
  <div class="t1">某某汽车 · 制动踏板极限测试</div>
  <div class="t2">正在加载 WebGL 构建</div>
  <div id="bar"><div id="fill"></div></div>
  <div id="pct">0%</div>
</div>
<div id="err"></div>
<script>
(function () {
  var BUILD = 'Build';
  var canvas = document.getElementById('unity-canvas');
  var loadEl = document.getElementById('load');
  var fillEl = document.getElementById('fill');
  var pctEl  = document.getElementById('pct');
  var errEl  = document.getElementById('err');

  function fail(msg) {
    errEl.style.display = 'block';
    errEl.textContent = String(msg);
    loadEl.classList.add('done');
  }

  var config = {
    dataUrl: 'Build/WebGL.data.unityweb',
    frameworkUrl: 'Build/WebGL.framework.js.unityweb',
    codeUrl: 'Build/WebGL.wasm.unityweb',
    streamingAssetsUrl: 'StreamingAssets',
    companyName: 'BrakeGame',
    productName: 'BrakeTest',
    productVersion: '1.0',
    matchWebGLToCanvasSize: true,
    showBanner: function (msg, type) {
      if (type === 'error' || type === 'warning') fail(msg);
    }
  };

  var s = document.createElement('script');
  s.src = 'Build/WebGL.loader.js';
  s.onerror = function () { fail('无法加载 Build/WebGL.loader.js'); };
  s.onload = function () {
    createUnityInstance(canvas, config, function (p) {
      var v = Math.round(p * 100);
      fillEl.style.width = v + '%';
      pctEl.textContent = v + '%';
    }).then(function (inst) {
      loadEl.classList.add('done');
      window.__unity = inst;   // 便于自动化验证
    }).catch(fail);
  };
  document.body.appendChild(s);
})();
</script>
</body>
</html>
